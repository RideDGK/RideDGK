<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideDGK Admin Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-container { background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 450px; width: 100%; }
    .login-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 30px; text-align: center; }
    .login-body { padding: 40px 30px; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h2>RideDGK Admin</h2>
      <p>Dashboard Login</p>
    </div>
    <div class="login-body">
      <form onsubmit="handleLogin(event)">
        <div class="form-group mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="admin@ridedgk.com" required>
        </div>
        <div class="form-group mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="admin123" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <div style="text-align: center; margin-top: 20px;"><small>Demo: admin@ridedgk.com / admin123</small></div>
    </div>
  </div>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('password').value;
      if (email === 'admin@ridedgk.com' && pwd === 'admin123') {
        localStorage.setItem('adminToken', 'token_' + Date.now());
        window.location.href = 'index.html';
      } else {
        alert('Invalid credentials');
      }
    }
  </script>
</body>
</html>
